<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stories</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    header {
      padding: 20px;
      background: white;
      font-size: 24px;
      font-weight: bold;
    }

    .stories {
      display: flex;
      gap: 15px;
      padding: 20px;
      overflow-x: auto;
      background: white;
    }

    .story {
      min-width: 70px;
      height: 70px;
      border-radius: 50%;
      padding: 3px;
      background: linear-gradient(45deg, #ff0066, #ffcc00);
      cursor: pointer;
      flex-shrink: 0;
    }

    .story img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid white;
    }

    .add {
      min-width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px dashed #777;
      background: white;
      font-size: 35px;
      cursor: pointer;
    }

    input {
      display: none;
    }

    /* Story viewer */

    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    .viewer img {
      max-width: min(90vw, 1080px);
      max-height: min(90vh, 1920px);
      object-fit: contain;
      border-radius: 10px;
    }

    .close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: white;
      font-size: 35px;
      cursor: pointer;
    }

    .prev,
    .next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,.2);
      color: white;
      border: none;
      font-size: 35px;
      padding: 10px 18px;
      cursor: pointer;
      border-radius: 50%;
    }

    .prev {
      left: 20px;
    }

    .next {
      right: 20px;
    }

    @media (max-width: 600px) {
      .prev,
      .next {
        font-size: 25px;
        padding: 8px 14px;
      }
    }
  </style>
</head>

<body>

  <header>Stories</header>

  <div class="stories" id="stories">

    <label class="add">
      +
      <input type="file" id="imageInput" accept="image/*">
    </label>

  </div>

  <!-- Story viewer -->

  <div class="viewer" id="viewer">

    <span class="close" onclick="closeViewer()">×</span>

    <button class="prev" onclick="previousStory()">‹</button>

    <img id="viewerImage">

    <button class="next" onclick="nextStory()">›</button>

  </div>


<script>

  const input = document.getElementById("imageInput");
  const storiesContainer = document.getElementById("stories");
  const viewer = document.getElementById("viewer");
  const viewerImage = document.getElementById("viewerImage");

  let stories = JSON.parse(localStorage.getItem("stories")) || [];
  let currentStory = 0;


  /* Remove stories older than 24 hours */

  function removeExpiredStories() {

    const now = Date.now();

    stories = stories.filter(story => {
      return now - story.time < 24 * 60 * 60 * 1000;
    });

    localStorage.setItem("stories", JSON.stringify(stories));
  }


  /* Display stories */

  function displayStories() {

    storiesContainer.innerHTML = `
      <label class="add">
        +
        <input type="file" id="imageInput" accept="image/*">
      </label>
    `;

    document.getElementById("imageInput")
      .addEventListener("change", uploadImage);

    stories.forEach((story, index) => {

      const div = document.createElement("div");

      div.className = "story";

      div.innerHTML = `
        <img src="${story.image}" alt="Story">
      `;

      div.onclick = () => openStory(index);

      storiesContainer.appendChild(div);

    });
  }


  /* Upload image */

  function uploadImage(event) {

    const file = event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("Please select an image.");
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {

      const image = new Image();

      image.onload = function() {

        /* Maximum dimensions */

        if (image.width > 1080 || image.height > 1920) {
          alert("Image must be maximum 1080 × 1920 pixels.");
          return;
        }

        const story = {
          image: e.target.result,
          time: Date.now()
        };

        stories.push(story);

        localStorage.setItem(
          "stories",
          JSON.stringify(stories)
        );

        displayStories();
      };

      image.src = e.target.result;
    };

    reader.readAsDataURL(file);
  }


  /* Open story */

  function openStory(index) {

    currentStory = index;

    viewerImage.src = stories[currentStory].image;

    viewer.style.display = "flex";
  }


  /* Next story */

  function nextStory() {

    if (stories.length === 0) return;

    currentStory++;

    if (currentStory >= stories.length) {
      currentStory = 0;
    }

    viewerImage.src = stories[currentStory].image;
  }


  /* Previous story */

  function previousStory() {

    if (stories.length === 0) return;

    currentStory--;

    if (currentStory < 0) {
      currentStory = stories.length - 1;
    }

    viewerImage.src = stories[currentStory].image;
  }


  /* Close viewer */

  function closeViewer() {
    viewer.style.display = "none";
  }


  /* Swipe support */

  let startX = 0;

  viewer.addEventListener("touchstart", e => {
    startX = e.touches[0].clientX;
  });

  viewer.addEventListener("touchend", e => {

    const endX = e.changedTouches[0].clientX;

    if (startX - endX > 50) {
      nextStory();
    }

    if (endX - startX > 50) {
      previousStory();
    }

  });


  /* Start app */

  removeExpiredStories();
  displayStories();

</script>

</body>
</html>
